ttom:6px}@media(max-width:700px){.grid{grid-template-columns:1fr}.bar{flex-wrap:wrap;padding:10px 0}.art{right:-18%;opacity:.42;width:65%}.row{grid-template-columns:36px 1fr auto}.row>small{font-size:.76rem}}@media(prefers-reduced-motion:no-preference){button{transition:border-color .15s,background .15s}}

<body>
<header><div class="bar"><div class="brand"><i aria-hidden="true">♪</i>Accord</div><nav aria-label="Navegación"><button class="btn" data-view="ruta">Ruta</button><button class="btn" data-view="afinador">Afinador</button><button class="btn" data-view="progreso">Progreso</button></nav></div></header>
<main id="app"></main>
<script>
'use strict';
const strings = [
  {name:'Mi grave',midi:40},{name:'La',midi:45},{name:'Re',midi:50},
  {name:'Sol',midi:55},{name:'Si',midi:59},{name:'Mi agudo',midi:64}
];
const lessons = [
  {title:'Afina tu guitarra',type:'Afinación',time:3,steps:['Sujeta la guitarra con el mástil ligeramente elevado. La cuerda más gruesa es la 6.ª y la más fina, la 1.ª.','Afina de la 6.ª a la 1.ª: Mi, La, Re, Sol, Si y Mi. Toca una cuerda cada vez y gira su clavija poco a poco hasta centrar el indicador.','Escucha las referencias y comprueba las seis cuerdas antes de pasar a la tablatura.']},
  {title:'Tus primeras notas',type:'Tablatura',time:4,bpm:60,steps:['Cada línea de la tablatura representa una cuerda. La línea de arriba es la 1.ª cuerda, la más fina. Lee de izquierda a derecha.','Un 0 significa cuerda al aire. Para el traste 1 usa el índice y colócalo justo detrás de la barrita metálica. Para el 3, usa el anular.','Escucha el ejemplo y toca una nota por pulso.'],notes:[[1,0],[1,1],[1,3],[1,1],[1,0],[1,0],[1,3],[1,0]]},
  {title:'Cambia de cuerda',type:'Técnica',time:5,bpm:64,steps:['Localiza las dos cuerdas más finas. La 1.ª al aire es Mi y la 2.ª es Si.','Deja que la mano derecha cambie de cuerda con un movimiento pequeño. Apaga la nota anterior al cambiar de cuerda para que suene una sola nota.'],notes:[[2,0],[2,1],[2,3],[1,0],[1,3],[1,0],[2,3],[2,0]]},
  {title:'Toca a pulso',type:'Ritmo',time:5,bpm:72,steps:['Cuenta cuatro pulsos al escuchar la entrada. Cada casilla ocupa un pulso. En una casilla vacía, deja pasar ese pulso y apaga la cuerda.','Empieza despacio. Cuando puedas anticipar cada cambio, vuelve al tempo de la lección.'],notes:[[1,0],[1,0],null,[1,3],[2,3],null,[2,1],[2,0]]},
  {title:'Tu primera pieza',type:'Pieza original',time:7,bpm:76,steps:['«Luz de patio» combina lo que has practicado. Escúchala una vez y trabaja los bloques de cuatro pulsos por separado.','Toca la pieza completa cuando los cambios de cuerda te salgan con comodidad.'],notes:[[1,0],[1,3],[1,1],[1,0],[2,3],[2,1],[2,0],null,[2,1],[2,3],[1,0],[1,3],[1,1],[2,3],[1,0],null]}
];
const app=document.querySelector('#app');
const KEY='traste.progreso.v1';
let history=[];
try{const value=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(value))history=value.filter(x=>x&&Number.isInteger(x.lesson)&&lessons[x.lesson]&&Number.isFinite(x.score));}catch{}
let storageFailed=false;
const passed=i=>history.some(x=>x.lesson===i&&x.score>=75);
const unlocked=i=>i===0||passed(i-1);
const next=()=>lessons.findIndex((_,i)=>!passed(i));
const midi=note=>strings[6-note[0]].midi+note[1];
const hz=n=>440*2**((n-69)/12);


const noteNames=['Do','Do♯','Re','Re♯','Mi','Fa','Fa♯','Sol','Sol♯','La','La♯','Si'];
const positionName=n=>n[0]+'.ª cuerda · '+(n[1]?'Traste '+n[1]:'Al aire');
let warmupPitch=null, inputId="";
const button=(label,id,primary=false)=>'<button class="btn '+(primary?'primary':'')+'" id="'+id+'">'+label+'</button>';
let view='ruta', selected=0, context, micSource, micOutput, analyser, stream, microphoneRequest, micGeneration=0, frame=0, laneFrame=0, voices=[], session=null, timer=0, generation=0;
function save(i,score,mode){
  history.unshift({lesson:i,score,mode,date:new Date().toISOString()});
  try{localStorage.setItem(KEY,JSON.stringify(history));}catch{storageFailed=true;}
}
function stopAudio(){
  for(const voice of voices){try{voice.stop();}catch{}}
  voices=[];
}
function stopMic(){
  micGeneration++;
  cancelAnimationFrame(frame);
  stream?.getTracks().forEach(track=>track.stop());
  micSource?.disconnect();
  analyser?.disconnect();
  micOutput?.disconnect();
  micSource=micOutput=analyser=stream=microphoneRequest=null;
}
function stop(){
  generation++;warmupPitch=null;cancelAnimationFrame(laneFrame);clearInterval(timer);session=null;stopAudio();stopMic();
}
async function audio(){
  const Audio=window.AudioContext||window.webkitAudioContext;
  if(!Audio)throw Error('Este navegador no puede reproducir audio.');
  context??=new Audio();
  await context.resume();
  return context;
}
const guitarSamples=new Map();
function guitarSample(note){
  const key=note.join('-');
  if(!guitarSamples.has(key)){
    const pending=fetch('audio/'+key+'.ogg')
      .then(response=>{
        if(!response.ok)throw Error('No se pudo cargar la grabación.');
        return response.arrayBuffer();
      })
      .then(data=>context.decodeAudioData(data))
      .then(buffer=>{
        // Match peaks without changing the attack or decay of the recording.
        let peak=0;
        for(const value of buffer.getChannelData(0))peak=Math.max(peak,Math.abs(value));
        return {buffer,gain:.58/Math.max(peak,.08)};
      })
      .catch(()=>{
        guitarSamples.delete(key);
        throw Error('No se pudo reproducir la grabación de guitarra. Inténtalo de nuevo.');
      });
    guitarSamples.set(key,pending);
  }
  return guitarSamples.get(key);
}
function playVoice(voice,volume,at,end){
  voice.connect(volume).connect(context.destination);
  voice.start(at);voice.stop(end);
  voices.push(voice);
  voice.onended=()=>{voices=voices.filter(item=>item!==voice);voice.disconnect();volume.disconnect();};
}
function playGuitar(sample,at,duration,dynamics=1,release=.075){
  const voice=context.createBufferSource();
  voice.buffer=sample.buffer;
  const volume=context.createGain();
  at=Math.max(at,context.currentTime);
  const end=at+Math.min(duration,sample.buffer.duration);
  const level=sample.gain*dynamics;
  volume.gain.setValueAtTime(level,at);
  volume.gain.setValueAtTime(level,Math.max(at,end-release));
  volume.gain.linearRampToValueAtTime(0,end);
  playVoice(voice,volume,at,end);
}
function exampleNotes(sequence,beat,firstBeat){
  return sequence.flatMap((note,index)=>{
    if(!note)return [];
    const previous=sequence[index-1];
    const next=sequence[index+1];
    const repeated=previous?.[0]===note[0]&&previous[1]===note[1];
    const pulse=(firstBeat+index)%4;
    const dynamics=[1,.91,.96,.89][pulse]*(repeated?.92:1);
    // Release before a repeated attack or silence. Let a closing note ring.
    const sameString=next?.[0]===note[0];
    const closing=index===sequence.length-1;
    const duration=closing?beat+Math.min(.45,beat*.5):!next?beat*.94:sameString?beat*.97:beat*1.08;
    const release=closing?.20:!next?.11:sameString?.065:.12;
    return [{note,index,duration,dynamics,release}];
  });
}
function clickBeat(frequency,at){
  const voice=context.createOscillator();
  voice.frequency.value=frequency;
  const volume=context.createGain();
  volume.gain.setValueAtTime(.0001,at);
  volume.gain.exponentialRampToValueAtTime(.038,at+.004);
  volume.gain.exponentialRampToValueAtTime(.0001,at+.043);
  playVoice(voice,volume,at,at+.043);
}
async function mic(onPitch,targetFrequency){
  stopMic();
  const token=micGeneration;
  if(!navigator.mediaDevices?.getUserMedia)throw Error('Abre Accord en un navegador con acceso al micrófono.');
  const request=navigator.mediaDevices.getUserMedia({audio:{
    ...(inputId?{deviceId:{exact:inputId}}:{}),
    echoCancellation:{ideal:false},autoGainControl:{ideal:false},noiseSuppression:{ideal:false}
  }});
  microphoneRequest=request;
  const input=await request;
  if(token!==micGeneration){input.getTracks().forEach(t=>t.stop());return false;}
  stream=input;
  const ctx=await audio();
  if(token!==micGeneration)return false;
  analyser=ctx.createAnalyser();
  analyser.fftSize=4096;
  micSource=ctx.createMediaStreamSource(input);
  micOutput=ctx.createGain();
  micOutput.gain.value=0;
  micSource.connect(analyser).connect(micOutput).connect(ctx.destination);
  const buffer=new Float32Array(analyser.fftSize);
  let lastFrame=-Infinity;
  function loop(){
    if(token!==micGeneration)return;
    frame=requestAnimationFrame(loop);
    if(ctx.currentTime-lastFrame<.028)return;
    lastFrame=ctx.currentTime;
    analyser.getFloatTimeDomainData(buffer);
    let energy=0;
    for(let i=buffer.length-1024;i<buffer.length;i++)energy+=buffer[i]*buffer[i];
    const target=targetFrequency?.();
    const recent=Math.min(buffer.length,Math.ceil((target ? .085 : .062)*ctx.sampleRate));
    onPitch(pitch(buffer.subarray(buffer.length-recent),ctx.sampleRate,target),ctx.currentTime,Math.sqrt(energy/1024));
  }
  loop();
  return true;
}
function pitch(samples,rate,target){
  let energy=0;
  const window=Math.min(target?2048:1536,Math.floor(rate*(target ? .038 : .026)),Math.floor(samples.length/2));
  for(let i=0;i<window;i++)energy+=samples[i]*samples[i];
  if(energy/window<.000001)return 0;
  const limit=Math.min(Math.floor(rate/68),samples.length-window-1);
  const curve=new Float64Array(limit+1);
  let total=0,first=0,preferred=0;
  for(let lag=1;lag<=limit;lag++){
    let diff=0;
    for(let i=0;i<window;i+=2){const delta=samples[i]-samples[i+lag];diff+=delta*delta;}
    total+=diff;curve[lag]=total?diff*lag/total:1;
    if(lag>Math.floor(rate/410)+1&&curve[lag-1]<.23&&curve[lag-1]<=curve[lag-2]&&curve[lag]>curve[lag-1]){
      const candidate=lag-1;
      if(!first)first=candidate;
      if(!target)break;
      const ratio=rate/(candidate*target);
      if(ratio>=.86&&ratio<=1.16&&(!preferred||curve[candidate]<curve[preferred]))preferred=candidate;
    }
  }
  if(!first)return 0;
  // Prefer the selected string period only when it fits appreciably better.
  const best=preferred&&curve[preferred]+.025<curve[first]?preferred:first;
  const a=curve[best-1],b=curve[best],c=curve[best+1];
  return rate/(best+(a-c)/(2*(a-2*b+c)));
}
function go(target,index){
  stop();view=target;
  if(index!==undefined)selected=index;
  render();window.scrollTo(0,0);
  const title=app.querySelector('h1');title.tabIndex=-1;title.focus({preventScroll:true});
}
document.querySelector('nav').onclick=e=>{if(e.target.dataset.view)go(e.target.dataset.view);};
function render(){
  document.querySelectorAll('nav button').forEach(el=>{
    const active=el.dataset.view===(view==='leccion'?'ruta':view);
    el.classList.toggle('active',active);
    if(active)el.setAttribute('aria-current','page');else el.removeAttribute('aria-current');
  });
  if(view==='ruta')route();
  if(view==='leccion')lesson();
  if(view==='afinador')tuner();
  if(view==='progreso')progress();
}
function route(){
  const current=next();
  const count=lessons.filter((_,i)=>passed(i)).length;
  app.innerHTML='<section class="hero"><div class="art" aria-hidden="true"></div><p class="eyebrow">Traste · Guitarra para principiantes</p><h1>Tu primera canción<br>empieza aquí.</h1><p class="muted">Afina, aprende tus primeras notas y toca una pieza completa a tu ritmo.</p>'+button(current<0?'Volver a tocar la pieza':current===0?'Empezar la ruta':'Continuar la ruta','continue',true)+'</section><div class="grid"><section class="card"><h2>Ruta de aprendizaje</h2>'+lessons.map((l,i)=>'<button class="row '+(passed(i)?'done':i===current?'current':'')+'" data-lesson="'+i+'" '+(unlocked(i)?'':'disabled')+'><span class="badge">'+(passed(i)?'✓':i+1)+'</span><span><strong>'+l.title+'</strong><small>'+l.type+' · '+l.time+' min</small></span><small>'+(passed(i)?'Completada':unlocked(i)?'Disponible':'Bloqueada')+'</small></button>').join('')+'</section><aside class="card"><h2>Tu progreso</h2><div class="metric">'+count+' / '+lessons.length+'</div><p class="muted">Lecciones completadas</p><progress aria-label="Lecciones completadas" value="'+count+'" max="'+lessons.length+'"></progress><div class="spaced">'+button('Ver historial','history')+'</div></aside></div>';
  document.querySelector('#continue').onclick=()=>go('leccion',current<0?lessons.length-1:current);
  document.querySelector('#history').onclick=()=>go('progreso');
  app.querySelectorAll('[data-lesson]').forEach(el=>el.onclick=()=>go('leccion',Number(el.dataset.lesson)));
}
function progress(){
  const count=lessons.filter((_,i)=>passed(i)).length;
  const modes={microfono:'Micrófono',pantalla:'Modo sin guitarra',afinacion:'Afinación'};
  app.innerHTML='<h1>Tu progreso</h1><div class="grid"><section class="card"><h2>Últimas prácticas</h2>'+(history.length?'<ul class="log">'+history.slice(0,12).map(x=>'<li><strong>'+lessons[x.lesson].title+'</strong> · '+(x.mode==='afinacion'?'Completada':x.score+' %')+'<br><small>'+ (modes[x.mode]??'Práctica')+' · '+new Date(x.date).toLocaleDateString('es-ES')+'</small></li>').join('')+'</ul>':'<p class="muted">Aquí aparecerán tus resultados cuando completes una práctica.</p>')+'</section><aside class="card"><h2>Ruta inicial</h2><p class="metric">'+count+' / '+lessons.length+'</p><progress aria-label="Lecciones completadas" value="'+count+'" max="'+lessons.length+'"></progress><p class="muted spaced">'+(storageFailed?'El navegador no ha podido guardar el historial.':'El historial se guarda en este navegador.')+'</p></aside></div>';
}
function tuner(){
  app.innerHTML='<h1>Afinador</h1><section class="card"><p>Elige una cuerda, activa el micrófono y tócala al aire.</p><div class="actions"><select id="string" aria-label="Cuerda">'+strings.map((s,i)=>'<option value="'+i+'">'+(6-i)+'.ª · '+s.name+'</option>').join('')+'</select>'+button('Escuchar referencia','reference')+button('Activar micrófono','enable',true)+button('Volver a medir','retune').replace('<button ','<button hidden ')+'</div><div class="meter" aria-hidden="true"><i id="needle"></i></div><div class="tune" id="reading">Esperando una nota</div><p class="status" id="status" role="status"></p></section>';
  const string=document.querySelector('#string'),enable=document.querySelector('#enable');
  const reading=document.querySelector('#reading'),needle=document.querySelector('#needle');
  const retune=document.querySelector('#retune');
  let referenceRequest=0,ignoreUntil=0,locked=false,tracker={samples:[],stableSince:null};
  const target=()=>hz(strings[string.value].midi);
  function resetTuner(){
    locked=false;tracker={samples:[],stableSince:null};
    reading.classList.remove('locked');
    needle.parentElement.classList.remove('locked');
    needle.style.left='50%';reading.textContent='Esperando una nota';retune.hidden=true;
    if(stream)status('Micrófono activo.');
  }
  string.onchange=retune.onclick=resetTuner;
  const reference=document.querySelector('#reference');
  reference.onclick=async()=>{
    const request=++referenceRequest,token=generation;
    const note=[6-Number(string.value),0];
    try{
      await audio();
      reference.textContent='Cargando grabación…';
      const sample=await guitarSample(note);
      if(token!==generation||request!==referenceRequest)return;
      stopAudio();
      ignoreUntil=context.currentTime+2.35;
      tracker={samples:[],stableSince:null};
      playGuitar(sample,context.currentTime,2.15);
    }catch(e){if(token===generation&&request===referenceRequest)status(e.message);}
    finally{if(token===generation&&request===referenceRequest)reference.textContent='Escuchar referencia';}
  };
  enable.onclick=async()=>{
    if(stream||microphoneRequest){stopMic();enable.textContent='Activar micrófono';status('Micrófono desactivado.');return;}
    enable.textContent='Cancelar micrófono';
    const token=micGeneration+1;
    try{
      resetTuner();
      if(await mic((frequency,now)=>{
        if(locked||now<ignoreUntil)return;
        const result=trackTuning(tracker,frequency,target(),now);
        if(!result){
          reading.textContent='Esperando una nota';needle.style.left='50%';return;
        }
        const cents=result.cents;
        if(result.confirmed){
          locked=true;needle.style.left='50%';
          reading.textContent='✓ '+strings[string.value].name+' · Cuerda afinada';
          reading.classList.add('locked');needle.parentElement.classList.add('locked');
          retune.hidden=false;
          status('Cuerda afinada. Elige la siguiente o pulsa Volver a medir.');
          clickBeat(660,now+.02);clickBeat(990,now+.10);
          return;
        }
        needle.style.left=(50+Math.max(-49,Math.min(49,cents/2)))+'%';
        reading.textContent=result.frequency.toFixed(1)+' Hz · '+(Math.abs(cents)<=8?'Mantén la nota':cents<0?'Sube la afinación':'Baja la afinación')+' ('+Math.round(cents)+' cents)';
      },target)){enable.textContent='Desactivar micrófono';status('Micrófono activo.');}
    }catch(e){if(token===micGeneration){stopMic();enable.textContent='Activar micrófono';status(micError(e));}}
  };
}
function trackTuning(state,frequency,target,now){
  if(frequency>0){
    state.samples=state.samples.filter(sample=>now-sample.time<.31);
    state.samples.push({time:now,cents:1200*Math.log2(frequency/target)});
    if(state.samples.length>9)state.samples.shift();
  }else if(!state.samples.length||now-state.samples.at(-1).time>.17){
    state.samples=[];state.stableSince=null;return null;
  }
  const ordered=state.samples.map(sample=>sample.cents).sort((a,b)=>a-b);
  const cents=ordered[Math.floor(ordered.length/2)];
  const inTune=ordered.filter(value=>Math.abs(value)<=8).length;
  const stable=frequency>0&&Math.abs(cents)<=8&&inTune>=5&&inTune>=ordered.length-1;
  if(!stable)state.stableSince=null;
  else state.stableSince??=now;
  return {cents,frequency:target*2**(cents/1200),confirmed:stable&&now-state.stableSince>=.14};
}
function micError(e){if(e.name==='NotReadableError')return 'No se puede leer esta entrada. Comprueba si otra aplicación está usando el micrófono.';if(e.name==='OverconstrainedError')return 'La entrada seleccionada no está disponible. Pulsa Tocar con micrófono para volver a la entrada predeterminada.';return e.name==='NotAllowedError'?'Permite el micrófono en el navegador o usa el modo sin guitarra.':e.name==='NotFoundError'?'No hay un micrófono disponible.':e.message;}
function status(message){const node=document.querySelector('#status');if(node)node.textContent=message;}
function tablature(notes){
  return '<div class="tabwrap"><table class="tab" aria-label="Tablatura del fragmento"><thead><tr><th scope="col">Cuerda</th>'+notes.map((_,i)=>'<th scope="col" data-beat="'+i+'">'+(i+1)+'</th>').join('')+'</tr></thead><tbody>'+[1,2,3,4,5,6].map(s=>'<tr><th scope="row">'+s+' · '+strings[6-s].name.replace(/ (grave|agudo)/,'')+'</th>'+notes.map((n,i)=>'<td class="'+(n?.[0]===s?'note':'')+'" data-beat="'+i+'">'+(n?.[0]===s?n[1]:'─')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
}
function lesson(){
  const l=lessons[selected];
  app.innerHTML='<div class="lesson"><div><p class="eyebrow">Lección '+(selected+1)+' de '+lessons.length+' · '+l.type+'</p><h1>'+l.title+'</h1>'+button('Volver a la ruta','back')+'</div><section class="card"><h2>Tutorial</h2><ol>'+l.steps.map(step=>'<li>'+step+'</li>').join('')+'</ol></section><section class="card">'+(!l.notes?'<h2>Comprueba tus cuerdas</h2><div class="actions">'+button('Abrir afinador','open-tuner')+button('Ya he afinado','complete',true)+'</div>':'<div class="practice-head"><div><h2>Práctica guiada</h2><p class="muted">Escucha el ejemplo y luego toca una nota por pulso.</p></div></div><div class="practice-settings"><label>Modo<select id="practice-mode"><option value="timed">A pulso</option><option value="guided">Nota a nota</option></select></label><label class="speed-label">Velocidad <output id="bpm">'+l.bpm+' BPM</output><input id="tempo" type="range" min="40" max="150" value="100" step="5" aria-label="Velocidad"></label><label>Fragmento<select id="segment"><option value="all">Completo</option>'+Array.from({length:Math.ceil(l.notes.length/4)},(_,i)=>'<option value="'+i+'">Pulsos '+(4*i+1)+'–'+Math.min(l.notes.length,4*i+4)+'</option>').join('')+'</select></label></div><div class="cue"><strong id="cue">Listo para empezar</strong><small id="beat-count"></small></div><div id="lane" class="lane" hidden aria-hidden="true"></div><span id="timing-live" class="timing-sr" role="status"></span><div id="tabs"></div><small>0 = cuerda al aire · Los demás números indican el traste.</small><div class="actions practice-actions">'+button('Escuchar ejemplo','demo')+button('Tocar con micrófono','play',true)+button('Practicar en pantalla','virtual')+button('Parar','stop').replace('<button ','<button hidden ')+'</div><details class="practice-help"><summary>Cómo se puntúa</summary><p>Tras cuatro pulsos de entrada, toca cada nota cuando llegue a la línea verde. Acierta al menos el 75 % del ejercicio completo para avanzar. Si usas el micrófono, ponte auriculares para escuchar el metrónomo.</p></details><div class="mic-check" id="mic-check" hidden><label class="input-label">Entrada de audio<select id="mic-input"><option value="">Micrófono predeterminado</option></select></label><label><meter id="mic-level" min="0" max="1" value="0"></meter>Nivel del micrófono</label><p id="mic-note">Esperando señal.</p><p id="warmup" role="status"></p>'+button('Empezar','begin',true).replace('<button ','<button hidden ')+'</div><div id="guided-tools" class="actions spaced" hidden></div><div id="keys" class="spaced practice-keys"></div>')+'<p class="status exercise-status" id="status" role="status"></p><div id="result"></div></section></div>';
  document.querySelector('#back').onclick=()=>go('ruta');
  if(!l.notes){
    document.querySelector('#open-tuner').onclick=()=>go('afinador');
    document.querySelector('#complete').onclick=()=>{save(selected,100,'afinacion');go('leccion',1);};
    return;
  }
  const segment=document.querySelector('#segment');
  const tempo=document.querySelector('#tempo');
  const practiceMode=document.querySelector('#practice-mode');
  const notes=()=>segment.value==='all'?l.notes:l.notes.slice(4*Number(segment.value),4*Number(segment.value)+4);
  const bpm=()=>Math.round(l.bpm*Number(tempo.value)/100);
  function reset(message=''){
    stop();practiceControls(false);showCue('Listo para empezar');document.querySelector('#tabs').innerHTML=tablature(notes());
    document.querySelector('#timing-live').textContent='';
    document.querySelector('#lane').hidden=true;
    document.querySelector('#tabs').hidden=false;
    document.querySelector('#mic-check').hidden=true;
    document.querySelector('#guided-tools').hidden=true;
    document.querySelector('#guided-tools').innerHTML='';
    document.querySelector('#keys').innerHTML='';document.querySelector('#result').innerHTML='';status(message);
  }
  reset();
  segment.onchange=()=>reset();
  practiceMode.onchange=()=>reset(practiceMode.value==='guided'?'La práctica espera a que aciertes cada nota.':'');
  tempo.oninput=()=>{document.querySelector('#bpm').textContent=bpm()+' BPM · '+tempo.value+' %';};
  tempo.onchange=()=>reset();
  document.querySelector('#stop').onclick=()=>reset('Práctica detenida.');
  document.querySelector('#demo').onclick=()=>start('demo');
  document.querySelector('#play').onclick=()=>start('microfono');
  document.querySelector('#virtual').onclick=()=>start('pantalla');
  document.querySelector('#mic-input').onchange=e=>{
    inputId=e.target.value;
    start('microfono');
  };
  async function listInputs(token){
    try{
      const devices=await navigator.mediaDevices.enumerateDevices();
      if(token!==generation)return;
      const select=document.querySelector('#mic-input');
      select.replaceChildren(new Option('Micrófono predeterminado',''));
      devices.filter(device=>device.kind==='audioinput'&&device.deviceId&&device.deviceId!=='default'&&device.deviceId!=='communications')
        .forEach((device,i)=>select.add(new Option(device.label||'Entrada '+(i+1),device.deviceId)));
      select.value=inputId;
      if(select.selectedIndex<0)select.selectedIndex=0;
    }catch{}
  }
  async function start(mode){
    reset();
    const token=generation,sequence=notes(),full=segment.value==='all';
    const beat=60/bpm();
    try{
      await audio();
      if(token!==generation)return;
      practiceControls(true);
      if(mode==='microfono'){
        status('Solicitando acceso al micrófono…');
        const ready=await mic((frequency,time,level)=>{
          updateMicReadout(frequency,level);
          if(session)detect(frequency,time,level);
        });
        if(!ready||token!==generation)return;
        status('');
        warmup(sequence,token);
        listInputs(token);
        return;
      }
      const samples=new Map();
      if(mode!=='microfono'){
        status('Cargando grabaciones de guitarra…');
        const positions=[...new Map((mode==='demo'?sequence:l.notes).filter(Boolean).map(n=>[n.join('-'),n])).values()];
        await Promise.all(positions.map(async note=>samples.set(note.join('-'),await guitarSample(note))));
        if(token!==generation)return;
        status('');
      }
      if(mode==='pantalla'&&practiceMode.value==='guided')guided(mode,sequence,samples);
      else run(mode,sequence,beat,full,samples);
    }catch(e){if(token===generation){if(e.name==='OverconstrainedError')inputId='';reset(micError(e));}}
  }
  function run(mode,sequence,beat,full,samples){
      const zero=context.currentTime+.12+(mode==='demo'?0:4*beat);
      session={mode,zero,beat,sequence,results:new Map(),rests:new Set(),lastPitch:0,lastOnset:-Infinity,level:0};
      let end=zero+sequence.length*beat;
      if(mode==='demo'){
        const firstBeat=full?0:4*Number(segment.value);
        for(const event of exampleNotes(sequence,beat,firstBeat)){
          const at=zero+event.index*beat;
          const sample=samples.get(event.note.join('-'));
          playGuitar(sample,at,event.duration,event.dynamics,event.release);
          end=Math.max(end,at+Math.min(event.duration,sample.buffer.duration));
        }
      }else{
        for(let i=-4;i<sequence.length;i++)clickBeat(i===-4?1040:780,zero+i*beat);
        if(mode==='pantalla')screenKeys(samples,n=>judge(midi(n),context.currentTime));
      }
      drawLane(sequence,zero,beat);
      let last=-5;
      timer=setInterval(()=>{
        if(!session)return;
        const now=context.currentTime;
        if(now>=end){finish(full);return;}
        const pos=Math.min(sequence.length-1,Math.floor((now-zero)/beat));
        if(pos===last)return;
        last=pos;
        if(pos>=0){
          const note=sequence[pos];
          showCue(note?note[0]+'.ª cuerda · '+(note[1]?'Traste '+note[1]:'Al aire'):'Silencio','Pulso '+(pos+1)+' de '+sequence.length);
        }else showCue('Prepárate','Entrada '+(5+pos)+' de 4');
      },25);
  }
  function screenKeys(samples,onNote){
    const keys=document.querySelector('#keys');
    keys.textContent='Elige la cuerda y el traste.';
    const positions=[...new Map(l.notes.filter(Boolean).map(n=>[n.join('-'),n])).values()];
    for(const n of positions){
      const key=document.createElement('button');
      key.className='btn key';key.textContent=positionName(n);
      key.onclick=()=>{
        if(!session)return;
        playGuitar(samples.get(n.join('-')),context.currentTime,.7);
        onNote(n);
      };
      keys.append(key);
    }
  }
  function guided(mode,sequence,samples){
    const positions=sequence.flatMap((note,index)=>note?[{note,index}]:[]);
    const tools=document.querySelector('#guided-tools');
    tools.hidden=false;
    tools.innerHTML=button('Escuchar esta nota','hear-note')+button('Saltar nota','skip-note');
    session={mode,practice:true,lastPitch:0,lastOnset:-Infinity,level:0};
    let step=0,correct=0;
    const token=generation;
    const next=()=>{
      const target=positions[step];
      if(!target){
        stop();practiceControls(false);
        tools.hidden=true;
        document.querySelector('#mic-check').hidden=true;
        document.querySelector('#keys').innerHTML='';
        document.querySelectorAll('.now').forEach(cell=>cell.classList.remove('now'));
        showCue('Práctica terminada',correct+' de '+positions.length+' notas');
        status('Para puntuar y avanzar, completa el ejercicio en modo A pulso.');
        return;
      }
      showCue(positionName(target.note),'Nota '+(step+1)+' de '+positions.length);
      document.querySelectorAll('[data-beat]').forEach(cell=>cell.classList.toggle('now',Number(cell.dataset.beat)===target.index));
    };
    session.onNote=heard=>{
      const target=positions[step];
      if(heard!==midi(target.note)){
        status('Prueba otra vez · '+positionName(target.note));
        return;
      }
      document.querySelector('td.note[data-beat="'+target.index+'"]')?.classList.add('hit');
      step++;correct++;
      status('Correcta');
      next();
    };
    document.querySelector('#skip-note').onclick=()=>{step++;status('Nota omitida');next();};
    document.querySelector('#hear-note').onclick=async()=>{
      const target=positions[step];
      try{
        const sample=await guitarSample(target.note);
        if(token!==generation||positions[step]!==target)return;
        if(mode==='microfono')session.ignoreUntil=context.currentTime+.95;
        playGuitar(sample,context.currentTime,.85);
      }catch(e){if(token===generation)status(e.message);}
    };
    if(mode==='pantalla')screenKeys(samples,n=>session?.onNote(midi(n)));
    next();
  }
  function warmup(sequence,token){
    const panel=document.querySelector('#mic-check'), begin=document.querySelector('#begin');
    const note=document.querySelector('#mic-note'), prompt=document.querySelector('#warmup');
    const targets=[...new Map(sequence.filter(Boolean).map(n=>[n.join('-'),n])).values()].slice(0,3);
    panel.hidden=false;begin.hidden=false;
    begin.textContent=practiceMode.value==='guided'?'Empezar nota a nota':'Empezar con metrónomo';
    note.textContent='Esperando señal.';
    showCue('Calentamiento');
    let index=0,frames=0;
    const offer=()=>{prompt.textContent=index>=targets.length?'Calentamiento completado.':'Prueba '+(index+1)+' de '+targets.length+' · '+positionName(targets[index]);};
    offer();
    warmupPitch=frequency=>{
      if(index>=targets.length)return;
      const heard=frequency?Math.round(69+12*Math.log2(frequency/440)):0;
      frames=heard===midi(targets[index])?frames+1:0;
      if(frames>=3){index++;frames=0;offer();}
    };
    begin.onclick=()=>{
      if(token!==generation||session)return;
      warmupPitch=null;
      begin.hidden=true;prompt.textContent='';
      if(practiceMode.value==='guided')guided('microfono',sequence,new Map());
      else run('microfono',sequence,60/bpm(),segment.value==='all',new Map());
    };
  }
}
function updateMicReadout(frequency,level){
  if(document.querySelector('#mic-check').hidden)return;
  document.querySelector('#mic-level').value=Math.max(0,Math.min(1,(20*Math.log10(level)+65)/48));
  const n=frequency?Math.round(69+12*Math.log2(frequency/440)):0;
  document.querySelector('#mic-note').textContent=n?'Nota detectada · '+noteNames[n%12]+(Math.floor(n/12)-1)+' · '+Math.round(frequency)+' Hz':level>.0015?'Llega señal. Toca una sola cuerda y deja que suene.':'Sin señal clara. Comprueba la entrada del navegador y acerca la guitarra.';
  warmupPitch?.(frequency);
}
function drawLane(sequence,zero,beat){
  const lane=document.querySelector('#lane');
  lane.hidden=false;
  document.querySelector('#tabs').hidden=true;
  lane.innerHTML='<div class="lane-strings">'+[1,2,3,4,5,6].map(i=>'<div class="lane-string">'+i+' · '+strings[6-i].name.split(' ')[0]+'</div>').join('')+'</div><div class="strike"></div><div class="timing"></div>';
  const markers=sequence.flatMap((note,index)=>{
    if(!note)return [];
    const marker=document.createElement('span');
    marker.className='lane-note';
    marker.textContent=note[1];
    marker.style.top='calc(12px + (100% - 24px) * '+((note[0]-.5)/6)+')';
    lane.append(marker);
    return [{marker,index}];
  });
  const badge=lane.querySelector('.timing');
  function draw(){
    if(!session)return;
    const now=context.currentTime;
    const progress=(now-zero)/beat;
    const feedback=session.feedback;
    const visible=feedback&&now<feedback.until;
    const label=visible?feedback.label:'';
    if(badge.textContent!==label)badge.textContent=label;
    badge.classList.toggle('perfect',visible&&label==='Perfecto');
    const width=lane.clientWidth;
    const spacing=(width*.77-18)/3;
    for(const {marker,index} of markers){
      const x=width*.23+(index-progress)*spacing;
      marker.hidden=x<0||x>width+16;
      marker.style.transform='translateX('+x+'px)';
      marker.classList.toggle('hit',session.results.get(index)===true);
      marker.classList.toggle('miss',session.results.get(index)===false);
    }
    laneFrame=requestAnimationFrame(draw);
  }
  draw();
}
function showCue(text,count=''){
  document.querySelector('#cue').textContent=text;
  document.querySelector('#beat-count').textContent=count;
}
function practiceControls(running){
  document.querySelector('#stop').hidden=!running;
  for(const id of ['demo','play','virtual'])document.querySelector('#'+id).disabled=running;
}
function detect(frequency,now,level){
  if(!session)return;
  const s=session;
  if(now<(s.ignoreUntil??0))return;
  const attack=level>Math.max(.0015,s.level*1.35);
  s.level=s.level*.80+level*.20;
  if(attack)s.attackAt=now;
  if(!frequency){
    if(level<.0015)s.lastPitch=0;
    return;
  }
  const raw=69+12*Math.log2(frequency/440);
  const rounded=Math.round(raw);
  if(Math.abs(raw-rounded)>.47)return;
  const freshAttack=Number.isFinite(s.attackAt)&&now-s.attackAt<.1;
  if((rounded!==s.lastPitch||freshAttack)&&now-s.lastOnset>.15){
    s.lastPitch=rounded;s.lastOnset=now;
    const onset=freshAttack?s.attackAt:now;
    s.attackAt=undefined;
    if(s.practice)s.onNote(rounded);
    else judge(rounded,onset-.024);
  }
}
function timingLabel(delta,beat){
  if(Math.abs(delta)<=Math.min(.115,beat*.19))return 'Perfecto';
  return delta<0?'Muy pronto':'Muy tarde';
}
function judge(note,now){
  const s=session, position=(now-s.zero)/s.beat;
  const index=Math.round(position);
  if(index<0||index>=s.sequence.length)return;
  const expected=s.sequence[index];
  const delta=now-(s.zero+index*s.beat);
  const inWindow=Math.abs(delta)<=s.beat*.36;
  if(!expected){if(inWindow)s.rests.add(index);return;}
  const correct=note===midi(expected);
  if(s.mode&&correct&&s.results.get(index)!==true){
    const label=timingLabel(delta,s.beat);
    s.feedback={label,until:context.currentTime+Math.min(.95,s.beat*.85)};
    document.querySelector('#timing-live').textContent=label+' · pulso '+(index+1);
  }
  if(!inWindow)return;
  if(s.results.get(index)!==true)s.results.set(index,correct);
  document.querySelectorAll('td[data-beat="'+index+'"]').forEach(td=>{
    td.classList.toggle('hit',s.results.get(index)===true);
    td.classList.toggle('miss',s.results.get(index)===false);
  });
}
function finish(full){
  const s=session;
  stop();practiceControls(false);
  document.querySelector('#timing-live').textContent='';
  document.querySelector('#lane').hidden=true;
  document.querySelector('#tabs').hidden=false;
  document.querySelector('#mic-check').hidden=true;
  showCue(s.mode==='demo'?'Ejemplo terminado':'Práctica terminada');document.querySelector('#keys').innerHTML='';
  document.querySelectorAll('.now').forEach(el=>el.classList.remove('now'));
  if(s.mode==='demo')return;
  const total=s.sequence.length;
  const hits=s.sequence.filter((n,i)=>n?s.results.get(i)===true:!s.rests.has(i)).length;
  const score=Math.round(100*hits/total);
  if(full)save(selected,score,s.mode);
  const outcome=s.sequence.map((n,i)=>{
    const correct=n?s.results.get(i)===true:!s.rests.has(i);
    document.querySelectorAll('td[data-beat="'+i+'"]').forEach(td=>td.classList.add(correct?'hit':'miss'));
    return correct?null:i+1;
  }).filter(Boolean);
  status(hits+' de '+total+' pulsos correctos · '+score+' %'+(full?'':' · Fragmento'));
  const result=document.querySelector('#result');
  result.innerHTML=(outcome.length?'<p>Pulsos para repetir: '+outcome.join(', ')+'.</p>':'<p>Has acertado todos los pulsos.</p>')+(full&&score>=75&&selected<lessons.length-1?button('Siguiente lección','next',true):full&&score>=75?'<p>Has completado la ruta inicial.</p>'+button('Ver progreso','next',true):'');
  const nextBtn=document.querySelector('#next');
  if(nextBtn)nextBtn.onclick=()=>selected<lessons.length-1?go('leccion',selected+1):go('progreso');
}
window.addEventListener('pagehide',stop);
render();
</script>
